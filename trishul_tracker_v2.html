<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A0C0F">
<title>त्रिशूल Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#08090B;
    --surface:#101317;
    --surface2:#161A1F;
    --border:rgba(242,194,48,0.35);
    --text:#F2F3F5;
    --text-dim:#9AA0AB;
    --text-faint:#5F6570;
    --gold:#F2C230;
    --gold-dim:#8A6E10;
    --green:#2FBF9F;
    --green-dim:#173D34;
    --red:#EF5350;
    --red-dim:#3D1F1E;
    --blue:#5B8DEF;
  }
  html[data-theme="light"]{
    --bg:#FAF9F5;
    --surface:#FFFFFF;
    --surface2:#F3F1E9;
    --border:rgba(180,140,10,0.4);
    --text:#1C1C1C;
    --text-dim:#5A5A5A;
    --text-faint:#8A8A8A;
    --gold:#B4860A;
    --gold-dim:#8A6E10;
    --green:#1E9E82;
    --green-dim:#DCF3EC;
    --red:#D6403C;
    --red-dim:#FBE1E0;
    --blue:#3D6FD1;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;height:100%;overflow-x:hidden;}
  #app{
    max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;
    background:
      radial-gradient(ellipse 800px 400px at 15% -5%, rgba(242,194,48,0.09), transparent 60%),
      radial-gradient(ellipse 600px 500px at 100% 20%, rgba(91,141,239,0.05), transparent 55%),
      var(--bg);
  }

  /* ---------- Header ---------- */
  header{
    padding:18px 18px 14px;
    background:linear-gradient(180deg, rgba(242,194,48,0.06) 0%, rgba(11,14,17,0) 100%);
    border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:10;
    backdrop-filter:blur(6px);
  }
  .brand-row{display:flex;align-items:center;justify-content:space-between;}
  .theme-toggle{
    display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px;gap:2px;
  }
  .theme-toggle button{
    border:none;background:none;padding:6px 12px;border-radius:16px;font-size:11px;font-weight:600;
    color:var(--text-faint);cursor:pointer;font-family:'Inter';
  }
  .theme-toggle button.active{background:var(--gold);color:#1A1305;}
  .brand{display:flex;align-items:center;gap:10px;}
  .trident{
    width:30px;height:30px;flex-shrink:0;
    filter:drop-shadow(0 0 3px rgba(242,194,48,0.35));
    animation:tridentGlow 3.2s ease-in-out infinite;
  }
  @keyframes tridentGlow{
    0%,100%{filter:drop-shadow(0 0 3px rgba(242,194,48,0.35));}
    50%{filter:drop-shadow(0 0 7px rgba(242,194,48,0.65));}
  }
  .brand-text h1{
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:20px;letter-spacing:0.5px;
    margin:0;color:var(--text);line-height:1.1;
  }
  .brand-text .sub{font-size:10.5px;color:var(--text-faint);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px;}
  .status-row{display:flex;align-items:center;gap:8px;margin-top:12px;}
  .pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);position:relative;flex-shrink:0;}
  .pulse-dot.live{background:var(--green);}
  .pulse-dot.live::after{
    content:'';position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--green);
    animation:pulse 1.8s ease-out infinite;
  }
  @keyframes pulse{0%{transform:scale(0.6);opacity:0.9;}100%{transform:scale(2.4);opacity:0;}}
  .status-text{font-size:11.5px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;}

  /* ---------- Tabs ---------- */
  nav.tabbar{
    display:flex;background:var(--surface);border-top:1px solid var(--border);
    position:sticky;bottom:0;z-index:10;padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabbar button{
    flex:1;background:none;border:none;padding:11px 4px 9px;color:var(--text-faint);
    font-family:'Inter';font-size:11px;font-weight:600;letter-spacing:0.3px;
    display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  }
  nav.tabbar button svg{width:19px;height:19px;opacity:0.55;}
  nav.tabbar button.active{color:var(--gold);}
  nav.tabbar button.active svg{opacity:1;}

  main{flex:1;padding:14px 14px 20px;overflow-y:auto;}

  /* ---------- KPI cards ---------- */
  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .kpi-grid.three{grid-template-columns:1fr 1fr 1fr;}
  .kpi{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 13px;
  }
  .kpi .label{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px;}
  .kpi .value{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;color:var(--text);}
  .kpi .value.green{color:var(--green);}
  .kpi .value.red{color:var(--red);}
  .kpi .value.gold{color:var(--gold);}

  /* ---------- Trade list ---------- */
  .section-label{font-family:'Rajdhani';font-weight:600;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--text-faint);margin:18px 2px 8px;}
  .trade-card{
    background:var(--surface);border:1px solid var(--border);color:var(--text-faint);
    border-radius:8px;padding:12px 13px 12px 15px;margin-bottom:9px;cursor:pointer;
    transition:background 0.15s;
  }
  .trade-card:active{background:var(--surface2);}
  .tc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .tc-name{font-weight:600;font-size:14px;color:var(--text);}
  .tc-strategy{font-size:10.5px;color:var(--text-faint);margin-top:2px;font-family:'JetBrains Mono',monospace;}
  .tc-pl{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14.5px;text-align:right;white-space:nowrap;}
  .tc-pl.green{color:var(--green);}
  .tc-pl.red{color:var(--red);}
  .tc-pl.open{color:var(--blue);font-size:11px;font-weight:600;}
  .tc-bottom{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;}
  .badge{
    display:inline-block;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:20px;
    letter-spacing:0.4px;text-transform:uppercase;
  }
  .badge.buy-call{background:var(--green-dim);color:var(--green);}
  .badge.buy-put{background:var(--red-dim);color:#F0908E;}
  .strategy-chip{
    display:inline-block;background:rgba(242,194,48,0.12);border:1px solid var(--border);
    color:var(--gold);font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;
    letter-spacing:0.4px;text-transform:uppercase;padding:3px 9px;border-radius:6px;margin-bottom:6px;
  }

  .empty{
    text-align:center;padding:60px 20px;color:var(--text-faint);
  }
  .empty svg{width:44px;height:44px;opacity:0.3;margin-bottom:12px;}
  .empty p{font-size:13px;line-height:1.6;}

  /* ---------- Settings ---------- */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:6px;font-weight:500;}
  .field input, .field select{
    width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;
    padding:11px 12px;color:var(--text);font-size:14px;font-family:'JetBrains Mono',monospace;
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--gold-dim);}
  .field .hint{font-size:11px;color:var(--text-faint);margin-top:5px;line-height:1.5;}
  .btn{
    width:100%;padding:13px;border-radius:9px;border:none;font-weight:700;font-size:14px;
    font-family:'Rajdhani',sans-serif;letter-spacing:0.5px;cursor:pointer;margin-top:6px;
  }
  .btn-primary{background:var(--gold);color:#1A1305;}
  .btn-danger{background:var(--red-dim);color:#F0908E;border:1px solid #5A2A28;}
  .btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
  .btn:active{opacity:0.8;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;}
  .card h3{font-family:'Rajdhani';font-size:15px;margin:0 0 12px;color:var(--gold);letter-spacing:0.3px;}
  .toast{
    position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--surface2);
    border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:8px;
    font-size:12.5px;z-index:100;opacity:0;transition:opacity 0.25s;pointer-events:none;max-width:90%;text-align:center;
  }
  .toast.show{opacity:1;}

  /* ---------- Strategy table ---------- */
  table.strat{width:100%;border-collapse:collapse;font-size:12px;}
  table.strat th{text-align:left;color:var(--text-faint);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:0.4px;padding:6px 6px;border-bottom:1px solid var(--border);}
  table.strat td{padding:8px 6px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;color:var(--text);}
  table.strat td.name{font-family:'Inter';font-weight:600;}
  table.strat tr:last-child td{border-bottom:none;}

  /* ---------- Detail modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:50;display:flex;align-items:flex-end;
    opacity:0;pointer-events:none;transition:opacity 0.2s;
  }
  .modal-backdrop.show{opacity:1;pointer-events:auto;}
  .modal{
    background:var(--surface);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:520px;margin:0 auto;
    max-height:82vh;overflow-y:auto;transform:translateY(20px);transition:transform 0.2s;
    border-top:1px solid var(--border);
  }
  .modal-backdrop.show .modal{transform:translateY(0);}
  .modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px;}
  .detail-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .detail-row:last-child{border-bottom:none;}
  .detail-row .k{color:var(--text-dim);}
  .detail-row .v{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--text);}

  ::-webkit-scrollbar{width:0;height:0;}

  /* ---------- Signature: Win Rate Ring ---------- */
  .ring-wrap{display:flex;align-items:center;gap:18px;padding:6px 2px 4px;}
  .ring-svg{flex-shrink:0;filter:drop-shadow(0 0 10px rgba(242,194,48,0.15));}
  .ring-bg{fill:none;stroke:var(--surface2);stroke-width:9;}
  .ring-fg{fill:none;stroke:var(--gold);stroke-width:9;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 0.8s cubic-bezier(.4,0,.2,1);}
  .ring-fg.red{stroke:var(--red);}
  .ring-center-val{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;fill:var(--text);}
  .ring-stats{flex:1;display:flex;flex-direction:column;gap:6px;}
  .ring-stat-row{display:flex;justify-content:space-between;font-size:12px;}
  .ring-stat-row .k{color:var(--text-faint);}
  .ring-stat-row .v{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--text);}

  /* ---------- Refined trade card ---------- */
  .trade-card{position:relative;overflow:hidden;}
  .trade-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:currentColor;opacity:0.9;}
  .trade-card.open{color:var(--blue);}
  .trade-card.target{color:var(--green);}
  .trade-card.loss{color:var(--red);}
  .tc-top{position:relative;}
  .exit-pill{
    display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;
    padding:3px 8px;border-radius:20px;letter-spacing:0.3px;background:rgba(255,255,255,0.04);
  }
  .tc-bottom{border-top:1px dashed var(--border);padding-top:7px;margin-top:9px;}
  .tc-bottom:first-of-type{border-top:none;padding-top:0;margin-top:8px;}

  /* ---------- Timeline ---------- */
  .timeline-item{position:relative;padding-left:6px;}
  .timeline-item .detail-row{border-bottom:1px dashed var(--border);}

  /* ---------- Best/Worst trade strip ---------- */
  .bw-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .bw-card{border-radius:10px;padding:12px 13px;border:1px solid var(--border);}
  .bw-card.best{background:linear-gradient(135deg, var(--green-dim), transparent);}
  .bw-card.worst{background:linear-gradient(135deg, var(--red-dim), transparent);}
  .bw-label{font-size:9.5px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-faint);margin-bottom:5px;}
  .bw-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px;}
  .bw-pl{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <svg class="trident" viewBox="0 0 40 40" fill="none">
        <path d="M20 6 L20 32" stroke="#F2C230" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M12 6 C12 12 15 15 20 15 C25 15 28 12 28 6" stroke="#F2C230" stroke-width="2.2" stroke-linecap="round"/>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="10" width="4" height="10"/><rect x="10" y="5" width="4" height="15"/><rect x="17" y="13" width="4" height="7"/></svg>
      Summary
    </button>
    <button class="tab-btn" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9c.36.11.7.3 1 .55"/></svg>
      Settings

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalContent"></div>

<script>
/* =========================================================
   STATE & STORAGE
   ========================================================= */
let settings = { botToken:'', chatId:'', pollInterval:15, offset:0, tracking:false, serverUrl:'', serverEventCount:0 };
let trades = {};       // id -> trade object
let activeTab = 'trades';
let summaryPeriod = 'day';
let pollTimer = null;

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];

function toast(msg, ms=2600){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), ms);
}

/* =========================================================
   STORAGE SHIM — window.storage only exists inside claude.ai
   artifacts. When this file is self-hosted (garudanexus.com),
   fall back to localStorage with the same get/set/list/delete
   interface so nothing else in the app needs to change.
   ========================================================= */
if(typeof window.storage === 'undefined'){
  const LS_PREFIX = 'trishul_tracker::';
  window.storage = {
    async get(key){
      const raw = localStorage.getItem(LS_PREFIX+key);
      if(raw === null) return null;
      return { key, value: raw, shared:false };
    },
    async set(key, value){
      localStorage.setItem(LS_PREFIX+key, value);
      return { key, value, shared:false };
    },
    async delete(key){
      localStorage.removeItem(LS_PREFIX+key);
      return { key, deleted:true, shared:false };
    },
    async list(prefix=''){
      const keys = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(LS_PREFIX+prefix)) keys.push(k.slice(LS_PREFIX.length));
      }
      return { keys, prefix, shared:false };
    }
  };
}

async function loadState(){
  try{
    const s = await window.storage.get('settings');
    if(s && s.value) settings = {...settings, ...JSON.parse(s.value)};
  }catch(e){}
  try{
    const idx = await window.storage.list('trades:');
    if(idx && idx.keys){
      for(const k of idx.keys){
        try{
          const r = await window.storage.get(k);
          if(r && r.value) trades[k] = JSON.parse(r.value);
        }catch(e){}
      }
    }
  }catch(e){}
}

async function saveSettings(){
  try{ await window.storage.set('settings', JSON.stringify(settings)); }catch(e){ toast('Could not save settings'); }
}
async function saveTrade(t){
  trades['trades:'+t.id] = t;
  try{ await window.storage.set('trades:'+t.id, JSON.stringify(t)); }catch(e){ toast('Could not save trade'); }
}

/* =========================================================
   TELEGRAM PARSING
   ========================================================= */
function num(str){ if(str===undefined||str===null) return null; const n = parseFloat(String(str).replace(/[,~]/g,'')); return isNaN(n)?null:n; }

function parseSignalMessage(text, msgTime){
  // New premium-based format
  let m = {};
  const symMatch = text.match(/(SENSEX|NIFTY|BANKNIFTY)\s+SIGNAL/i);
  if(!symMatch) return null;
  m.symbol = symMatch[1].toUpperCase();

  const stratMatch = text.match(/Strategy:\s*([a-zA-Z]+)\s*[—-]\s*([^\n]+)/);
  m.strategy = stratMatch ? stratMatch[1].trim() : 'unknown';
  m.strategyLabel = stratMatch ? stratMatch[2].trim() : '';

  const sigMatch = text.match(/Signal:\s*(BUY|SELL)\s*(CALL|PUT)/i);
  m.direction = sigMatch ? (sigMatch[1].toUpperCase()+' '+sigMatch[2].toUpperCase()) : null;

  const confMatch = text.match(/Confidence:\s*([\d.]+)/);
  m.confidence = confMatch ? num(confMatch[1]) : null;

  const contractMatch = text.match(/Contract:\s*([A-Z]+)\s*(\d+)\s*(CE|PE)\s*\(exp\s*([\d-]+)\)/i) ||
                         text.match(/TRADE:\s*([A-Z]+)\s*(\d+)\s*(CE|PE)\s*@\s*~?([\d.]+)\s*\(exp\s*([\d-]+)/i);
  if(contractMatch){
    if(contractMatch.length >= 5 && contractMatch[3] && !contractMatch[4].match(/\d{2}-\d{2}-\d{4}/) === false){
      // handle both patterns generically below
    }
  }
  const contractMatch2 = text.match(/(\d{4,6})\s*(CE|PE)\s*\(exp\s*([\d-]+)\)/i);
  if(contractMatch2){
    m.strike = contractMatch2[1];
    m.optType = contractMatch2[2].toUpperCase();
    m.expiry = contractMatch2[3];
  }

  // premium format
  const entryP = text.match(/ENTRY\s*\(premium\):\s*([\d.]+)/i);
  const targetP = text.match(/TARGET\s*\(premium\):\s*([\d.]+)/i);
  const slP = text.match(/SL\s*\(premium\):\s*([\d.]+)/i);
  if(entryP){
    m.format = 'premium';
    m.entry = num(entryP[1]);
    m.target = targetP ? num(targetP[1]) : null;
    m.sl = slP ? num(slP[1]) : null;
  } else {
    // old spot format: TRADE: SENSEX 77600 PE @ ~368.6
    const tradeMatch = text.match(/@\s*~?([\d.]+)\s*\(exp/);
    const spotLevels = text.match(/entry\s*([\d.]+)\s*\|\s*SL\s*([\d.]+)\s*\|\s*target\s*([\d.]+)/i);
    m.format = 'spot-legacy';
    m.entry = tradeMatch ? num(tradeMatch[1]) : null;
    if(spotLevels){
      m.spotEntry = num(spotLevels[1]); m.spotSL = num(spotLevels[2]); m.spotTarget = num(spotLevels[3]);
    }
  }

  const trailMatch = text.match(/trailing-SL[:\s]*~?([\d.]+)/i);
  m.trailingSL = trailMatch ? num(trailMatch[1]) : null;

  const spotRefMatch = text.match(/Spot:\s*([\d.]+)/i);
  m.spotRef = spotRefMatch ? num(spotRefMatch[1]) : null;

  const timeMatch = text.match(/Time:\s*([\dT:.+-]+)/);
  m.signalTime = timeMatch ? timeMatch[1] : msgTime;

  const noteMatch = text.match(/Note:\s*(.+)/);
  m.note = noteMatch ? noteMatch[1].trim() : '';

  m.id = (m.symbol||'X')+'_'+(m.strategy||'x')+'_'+(m.strike||'')+ (m.optType||'') +'_'+ (m.signalTime||msgTime).replace(/[^0-9]/g,'').slice(0,17);
  m.status = 'OPEN';
  m.rawSignal = text;
  m.receivedAt = msgTime;
  return m;
}

function parseExitMessage(text, msgTime){
  const exitHeader = text.match(/(SENSEX|NIFTY|BANKNIFTY)\s+EXIT\s*[—-]\s*(TARGET HIT|STOP-LOSS HIT|TRAILING-SL HIT|SL HIT)/i);
  if(!exitHeader) return null;
  const e = {};
  e.symbol = exitHeader[1].toUpperCase();
  const reasonRaw = exitHeader[2].toUpperCase();
  e.exitReason = reasonRaw.includes('TARGET') ? 'TARGET' : (reasonRaw.includes('TRAILING') ? 'TRAILING_SL' : 'SL');

  const stratMatch = text.match(/Strategy:\s*([a-zA-Z]+)\s*[—-]\s*([^\n]+)/);
  e.strategy = stratMatch ? stratMatch[1].trim() : 'unknown';
  e.strategyLabel = stratMatch ? stratMatch[2].trim() : '';

  const plMatch = text.match(/Entry:\s*([\d.]+)\s*->\s*Exit:\s*([\d.]+)\s*\|\s*P\/L:\s*(-?[\d.]+)\s*pts/i);
  if(plMatch){
    e.entrySpot = num(plMatch[1]); e.exitSpot = num(plMatch[2]); e.plSpotPts = num(plMatch[3]);
  }
  const premMatch = text.match(/entry premium was\s*~?([\d.]+)/i);
  e.entryPremiumRef = premMatch ? num(premMatch[1]) : null;

  const exitPremMatch = text.match(/exit premium[:\s]*~?([\d.]+)/i) || text.match(/Exit\s*\(premium\)[:\s]*~?([\d.]+)/i);
  e.exitPremium = exitPremMatch ? num(exitPremMatch[1]) : null;

  const contractMatch2 = text.match(/(\d{4,6})\s*(CE|PE)/i);
  if(contractMatch2){ e.strike = contractMatch2[1]; e.optType = contractMatch2[2].toUpperCase(); }

  e.exitTime = msgTime;
  e.rawExit = text;
  return e;
}

function findOpenTradeFor(exit){
  // most recent OPEN trade with same strategy + strike + optType (or symbol if strike missing)
  const candidates = Object.values(trades).filter(t =>
    t.status === 'OPEN' &&
    t.strategy === exit.strategy &&
    t.symbol === exit.symbol &&
    (!exit.strike || t.strike === exit.strike) &&
    (!exit.optType || t.optType === exit.optType)
  );
  if(candidates.length === 0) return null;
  candidates.sort((a,b)=> new Date(b.receivedAt) - new Date(a.receivedAt));
  return candidates[0];
}

/* =========================================================
   SERVER FEED POLLING (same raw message Trishul Pro sends to
   Telegram, forwarded here too — reuses same text parsers)
   ========================================================= */
async function pollServerFeed(){
  if(!settings.serverUrl) return;
  const base = settings.serverUrl.replace(/\/$/,'');
  try{
    const res = await fetch(base + '/api/tracker/data');
    const data = await res.json();
    if(!Array.isArray(data)){
      setLive(false, 'Server feed: unexpected response');
      return;
    }
    const startIdx = settings.serverEventCount || 0;
    const newEvents = data.slice(startIdx);
    for(const evt of newEvents){
      const text = evt.text || evt.message || '';
      const msgTime = evt.time || evt.receivedAt || new Date().toISOString();
      if(!text) continue;

      const sig = parseSignalMessage(text, msgTime);
      if(sig){ await saveTrade(sig); continue; }

      const exit = parseExitMessage(text, msgTime);
      if(exit){
        const open = findOpenTradeFor(exit);
        if(open){
          open.status = exit.exitReason;
          open.exitTime = exit.exitTime;
          open.exitPremium = exit.exitPremium;
          open.entryPremiumRefFromExit = exit.entryPremiumRef;
          open.exitSpot = exit.exitSpot;
          open.plSpotPts = exit.plSpotPts;
          if(open.entry != null && exit.exitPremium != null){
            open.plPremium = +(exit.exitPremium - open.entry).toFixed(2);
          }
          await saveTrade(open);
        }
      }
    }
    settings.serverEventCount = data.length;
    await saveSettings();
    setLive(true, 'Live — server feed synced ' + new Date().toLocaleTimeString('en-IN',{hour12:true}));
    render();
  }catch(err){
    setLive(false, 'Server feed: connection issue — retrying');
  }
}

/* =========================================================
   TELEGRAM POLLING
   ========================================================= */
async function pollOnce(){
  if(settings.serverUrl){ await pollServerFeed(); return; }
  if(!settings.botToken){ return; }
  const url = `https://api.telegram.org/bot${settings.botToken}/getUpdates?offset=${settings.offset}&timeout=0`;
  try{
    const res = await fetch(url);
    const data = await res.json();
    if(!data.ok){
      setLive(false, 'Telegram error: ' + (data.description || 'unknown'));
      return;
    }
    if(data.result.length === 0){
      setLive(true, 'Live — waiting for next signal');
      return;
    }
    for(const upd of data.result){
      settings.offset = upd.update_id + 1;
      const msgObj = upd.message || upd.channel_post;
      if(!msgObj || !msgObj.text) continue;
      if(settings.chatId && String(msgObj.chat.id) !== String(settings.chatId)) continue;
      const text = msgObj.text;
      const msgTime = new Date((msgObj.date||Date.now()/1000)*1000).toISOString();

      const sig = parseSignalMessage(text, msgTime);
      if(sig){ await saveTrade(sig); continue; }

      const exit = parseExitMessage(text, msgTime);
      if(exit){
        const open = findOpenTradeFor(exit);
        if(open){
          open.status = exit.exitReason;
          open.exitTime = exit.exitTime;
          open.exitPremium = exit.exitPremium;
          open.entryPremiumRefFromExit = exit.entryPremiumRef;
          open.exitSpot = exit.exitSpot;
          open.plSpotPts = exit.plSpotPts;
          // compute premium P/L if we have both entry & exit premium
          if(open.entry != null && exit.exitPremium != null){
            open.plPremium = +(exit.exitPremium - open.entry).toFixed(2);
          } else if(open.entry != null && exit.entryPremiumRef != null && exit.plSpotPts != null){
            // fallback: unknown precise premium exit, leave null
          }
          await saveTrade(open);
        }
      }
    }
    await saveSettings();
    setLive(true, 'Live — last synced ' + new Date().toLocaleTimeString('en-IN',{hour12:true}));
    render();
  }catch(err){
    setLive(false, 'Connection issue — will retry');
  }
}

function setLive(isLive, text){
  $('#pulseDot').classList.toggle('live', isLive);
  $('#statusText').textContent = text;
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  settings.tracking = true;
  saveSettings();
  pollOnce();
  pollTimer = setInterval(pollOnce, Math.max(5, settings.pollInterval)*1000);
}
function stopPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = null;
  settings.tracking = false;
  saveSettings();
  setLive(false, 'Tracking stopped');
}

/* =========================================================
   RENDERING
   ========================================================= */
function tradeList(){
  return Object.values(trades).sort((a,b)=> new Date(b.receivedAt) - new Date(a.receivedAt));
}

function fmtTime(iso){
  if(!iso) return '--';
  const d = new Date(iso);
  return d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
}

function fmtDuration(startIso, endIso){
  if(!startIso) return '--';
  const start = new Date(startIso);
  const end = endIso ? new Date(endIso) : new Date();
  let mins = Math.round((end-start)/60000);
  if(mins < 0) mins = 0;
  if(mins < 60) return mins+'m';
  const h = Math.floor(mins/60), m = mins%60;
  return h+'h '+m+'m';
}

function exitIcon(status){
  if(status==='TARGET') return '🎯';
  if(status==='SL') return '🛑';
  if(status==='TRAILING_SL') return '📉';
  return '●';
}

function statusMeta(t){
  if(t.status==='OPEN') return {cls:'open', label:'OPEN · tracking'};
  if(t.status==='TARGET') return {cls:'target', label:'TARGET HIT'};
  if(t.status==='SL') return {cls:'loss', label:'SL HIT'};
  if(t.status==='TRAILING_SL') return {cls:'loss', label:'TRAILING-SL HIT'};
  return {cls:'open', label:t.status};
}

function plDisplay(t){
  if(t.status==='OPEN') return {text:'TRACKING', cls:'open'};
  let pl = t.plPremium;
  if(pl == null && t.entry!=null && t.exitPremium!=null) pl = +(t.exitPremium - t.entry).toFixed(2);
  if(pl == null) return {text: (t.plSpotPts!=null ? (t.plSpotPts>0?'+':'')+t.plSpotPts.toFixed(1)+' spot pts' : '--'), cls: (t.plSpotPts>0?'green':'red')};
  return {text: (pl>=0?'+':'')+pl.toFixed(1), cls: pl>=0?'green':'red'};
}

function buildTimeline(){
  const events = [];
  tradeList().forEach(t=>{
    events.push({
      time: t.receivedAt,
      kind: 'ENTRY',
      icon: '🟢',
      text: `Entry — ${t.symbol||''} ${t.strike||''}${t.optType||''} (${(t.strategy||'').toUpperCase()}) @ ₹${t.entry ?? '--'}`
    });
    if(t.status!=='OPEN' && t.exitTime){
      const pl = plDisplay(t);
      events.push({
        time: t.exitTime,
        kind: t.status,
        icon: exitIcon(t.status),
        text: `${statusMeta(t).label} — ${t.symbol||''} ${t.strike||''}${t.optType||''} (${(t.strategy||'').toUpperCase()}) @ ₹${t.exitPremium ?? '--'} · P/L ${pl.text} · ${fmtDuration(t.receivedAt, t.exitTime)} में हुआ`
      });
    }
  });
  return events.sort((a,b)=> new Date(b.time) - new Date(a.time));
}

function renderTimeline(){
  const events = buildTimeline();
  if(events.length===0) return '';
  return `
  <div class="section-label">Activity Timeline · कब क्या हुआ</div>
  <div class="card" style="padding:6px 13px;">
    ${events.map(e=>`
      <div class="detail-row">
        <span class="k" style="font-family:'JetBrains Mono',monospace;">${fmtTime(e.time)} ${e.icon}</span>
        <span class="v" style="font-family:'Inter';font-weight:500;text-align:right;font-size:12px;">${e.text}</span>
      </div>
    `).join('')}
  </div>`;
}

function computeSummary(){
  const list = tradeList();
  const closed = list.filter(t=>t.status!=='OPEN');
  const open = list.filter(t=>t.status==='OPEN');
  let wins=0, losses=0, totalPL=0;
  const byStrategy = {};
  closed.forEach(t=>{
    let pl = t.plPremium;
    if(pl == null && t.entry!=null && t.exitPremium!=null) pl = +(t.exitPremium - t.entry).toFixed(2);
    if(pl == null) pl = t.plSpotPts || 0;
    totalPL += pl;
    if(pl>=0) wins++; else losses++;
    const s = t.strategy || 'unknown';
    if(!byStrategy[s]) byStrategy[s] = {trades:0, wins:0, pl:0};
    byStrategy[s].trades++;
    if(pl>=0) byStrategy[s].wins++;
    byStrategy[s].pl += pl;
  });
  const winRate = closed.length ? (wins/closed.length*100) : 0;
  const stratRows = Object.entries(byStrategy).map(([name,d])=>({
    name, trades:d.trades, winRate: d.trades? (d.wins/d.trades*100):0, pl:+d.pl.toFixed(1)
  })).sort((a,b)=>b.pl-a.pl);
  return {total:list.length, open:open.length, closed:closed.length, wins, losses, winRate, totalPL:+totalPL.toFixed(1), stratRows};
}

function groupByPeriod(list, period){
  const groups = {};
  list.forEach(t=>{
    if(t.status==='OPEN') return;
    let pl = t.plPremium;
    if(pl == null && t.entry!=null && t.exitPremium!=null) pl = +(t.exitPremium - t.entry).toFixed(2);
    if(pl == null) pl = t.plSpotPts || 0;
    const d = new Date(t.exitTime || t.receivedAt);
    let key;
    if(period==='hour'){
      key = d.toLocaleDateString('en-IN') + ' ' + String(d.getHours()).padStart(2,'0') + ':00';
    } else if(period==='day'){
      key = d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
    } else if(period==='week'){
      const onejan = new Date(d.getFullYear(),0,1);
      const week = Math.ceil((((d-onejan)/86400000)+onejan.getDay()+1)/7);
      key = 'Week ' + week + ', ' + d.getFullYear();
    } else {
      key = d.toLocaleDateString('en-IN',{month:'long',year:'numeric'});
    }
    if(!groups[key]) groups[key] = {trades:0, wins:0, pl:0};
    groups[key].trades++;
    if(pl>=0) groups[key].wins++;
    groups[key].pl += pl;
  });
  return Object.entries(groups).map(([k,v])=>({period:k, trades:v.trades, winRate: v.trades? (v.wins/v.trades*100):0, pl:+v.pl.toFixed(1)}));
}

function computeAdvancedAnalytics(){
  const closed = tradeList().filter(t=>t.status!=='OPEN').sort((a,b)=> new Date(a.exitTime||a.receivedAt) - new Date(b.exitTime||b.receivedAt));
  const pls = closed.map(t=>{
    let pl = t.plPremium;
    if(pl == null && t.entry!=null && t.exitPremium!=null) pl = +(t.exitPremium - t.entry).toFixed(2);
    if(pl == null) pl = t.plSpotPts || 0;
    return pl;
  });
  const wins = pls.filter(p=>p>0);
  const losses = pls.filter(p=>p<0);
  const grossWin = wins.reduce((a,b)=>a+b,0);
  const grossLoss = Math.abs(losses.reduce((a,b)=>a+b,0));
  const profitFactor = grossLoss>0 ? +(grossWin/grossLoss).toFixed(2) : (grossWin>0?Infinity:0);
  const avgWin = wins.length ? +(grossWin/wins.length).toFixed(2) : 0;
  const avgLoss = losses.length ? +(grossLoss/losses.length).toFixed(2) : 0;
  const winRate = pls.length ? wins.length/pls.length : 0;
  const lossRate = pls.length ? losses.length/pls.length : 0;
  const expectancy = +((winRate*avgWin) - (lossRate*avgLoss)).toFixed(2);

  // max drawdown on cumulative equity curve
  let cum=0, peak=0, maxDD=0;
  pls.forEach(p=>{ cum+=p; if(cum>peak) peak=cum; const dd=peak-cum; if(dd>maxDD) maxDD=dd; });

  // streaks
  let curStreak=0, curType=null, bestWinStreak=0, worstLossStreak=0, tmpWin=0, tmpLoss=0;
  pls.forEach(p=>{
    if(p>=0){ tmpWin++; tmpLoss=0; if(tmpWin>bestWinStreak) bestWinStreak=tmpWin; }
    else { tmpLoss++; tmpWin=0; if(tmpLoss>worstLossStreak) worstLossStreak=tmpLoss; }
  });
  if(pls.length){
    const last = pls[pls.length-1];
    curType = last>=0 ? 'W' : 'L';
    for(let i=pls.length-1;i>=0;i--){
      const isWin = pls[i]>=0;
      if((curType==='W' && isWin) || (curType==='L' && !isWin)) curStreak++;
      else break;
    }
  }

  // symbol-wise
  const bySymbol = {};
  closed.forEach((t,i)=>{
    const sym = t.symbol||'UNKNOWN';
    if(!bySymbol[sym]) bySymbol[sym] = {trades:0, wins:0, pl:0};
    bySymbol[sym].trades++;
    if(pls[i]>=0) bySymbol[sym].wins++;
    bySymbol[sym].pl += pls[i];
  });
  const symbolRows = Object.entries(bySymbol).map(([name,d])=>({name, trades:d.trades, winRate:d.trades?(d.wins/d.trades*100):0, pl:+d.pl.toFixed(1)}));

  return {profitFactor, expectancy, avgWin, avgLoss, maxDD:+maxDD.toFixed(1), bestWinStreak, worstLossStreak, curStreak, curType, symbolRows};
}

function findBestWorst(){
  const closed = tradeList().filter(t=>t.status!=='OPEN');
  let best=null, worst=null, bestVal=-Infinity, worstVal=Infinity;
  closed.forEach(t=>{
    let pl = t.plPremium;
    if(pl == null && t.entry!=null && t.exitPremium!=null) pl = +(t.exitPremium - t.entry).toFixed(2);
    if(pl == null) pl = t.plSpotPts || 0;
    if(pl > bestVal){ bestVal = pl; best = t; }
    if(pl < worstVal){ worstVal = pl; worst = t; }
  });
  return {best, bestVal, worst, worstVal};
}

        <td>${r.trades}</td>
        <td>${r.winRate.toFixed(0)}%</td>
        <td style="color:${r.pl>=0?'var(--green)':'var(--red)'}">${r.pl>=0?'+':''}${r.pl}</td>
      </tr>`).join('')}
    </table>`}
  </div>

  <div class="card">
    <h3>Strategy Performance</h3>
    ${s.stratRows.length===0 ? '<div style="color:var(--text-faint);font-size:12.5px;">अभी कोई closed trade नहीं है strategy-wise data दिखाने के लिए।</div>' : `
    <table class="strat">
      <tr><th>Strategy</th><th>Trades</th><th>Win %</th><th>P/L</th></tr>
      ${s.stratRows.map(r=>`<tr>
        <td class="name">${r.name}</td>
        <td>${r.trades}</td>
        <td>${r.winRate.toFixed(0)}%</td>
        <td style="color:${r.pl>=0?'var(--green)':'var(--red)'}">${r.pl>=0?'+':''}${r.pl}</td>
      </tr>`).join('')}
    </table>`}
  </div>

  <div class="card">
    <h3>Advanced Analytics</h3>
    <div class="kpi-grid three" style="margin-bottom:10px;">
      <div class="kpi"><div class="label">Profit Factor</div><div class="value ${adv.profitFactor>=1?'green':'red'}">${adv.profitFactor===Infinity?'∞':adv.profitFactor}</div></div>
      <div class="kpi"><div class="label">Expectancy</div><div class="value ${adv.expectancy>=0?'green':'red'}">${adv.expectancy>=0?'+':''}${adv.expectancy}</div></div>
      <div class="kpi"><div class="label">Max Drawdown</div><div class="value red">-${adv.maxDD}</div></div>
    </div>
    <div class="kpi-grid three">
      <div class="kpi"><div class="label">Avg Winner</div><div class="value green">+${adv.avgWin}</div></div>
      <div class="kpi"><div class="label">Avg Loser</div><div class="value red">-${adv.avgLoss}</div></div>
      <div class="kpi"><div class="label">Current Streak</div><div class="value ${adv.curType==='W'?'green':'red'}">${adv.curStreak||0}${adv.curType||''}</div></div>
    </div>
    <div style="margin-top:10px;font-size:11px;color:var(--text-faint);">Best win streak: ${adv.bestWinStreak} · Worst loss streak: ${adv.worstLossStreak}</div>
  </div>

  <div class="card">
    <h3>Symbol-wise Performance</h3>
    ${adv.symbolRows.length===0 ? '<div style="color:var(--text-faint);font-size:12.5px;">अभी data नहीं है।</div>' : `
    <table class="strat">
      <tr><th>Symbol</th><th>Trades</th><th>Win %</th><th>P/L</th></tr>
      ${adv.symbolRows.map(r=>`<tr>
        <td class="name">${r.name}</td><td>${r.trades}</td><td>${r.winRate.toFixed(0)}%</td>
        <td style="color:${r.pl>=0?'var(--green)':'var(--red)'}">${r.pl>=0?'+':''}${r.pl}</td>
      </tr>`).join('')}
    </table>`}
  </div>

  <button class="btn btn-primary" onclick="exportPDF()">📄 Export PDF Report</button>
  <button class="btn btn-secondary" onclick="exportJSONData()">⬇ Export JSON Data</button>
  `;
}
window.setSummaryPeriod = function(p){ summaryPeriod = p; render(); };

function renderSettings(){
  return `
  <div class="card">
    <h3>Direct Server Feed <span style="font-size:10px;color:var(--green);font-weight:600;">RECOMMENDED</span></h3>
    <div class="field">
      <label>Server Address</label>
      <input type="text" id="inpServerUrl" placeholder="https://garudanexus.com" value="${settings.serverUrl||''}">
      <div class="hint">वही पता जो Trishul Pro server वाले Claude से बनवाया — जैसे ही यहाँ भरोगे, ये Telegram Bot Token से data नहीं मांगेगा, सीधे इस पते से वही message पढ़ेगा जो Trishul Pro Telegram पर भी भेजता है।</div>
    </div>
    <div class="field">
      <label>Poll Interval (seconds)</label>
      <input type="number" id="inpInterval2" min="5" value="${settings.pollInterval}">
    </div>
    <button class="btn btn-primary" onclick="handleStartServer()">${settings.tracking && settings.serverUrl ? '🔄 Restart Tracking' : '▶ Start Tracking (Server Feed)'}</button>
    ${settings.tracking && settings.serverUrl ? `<button class="btn btn-danger" onclick="handleStop()">■ Stop Tracking</button>` : ''}
  </div>

  <div class="card">
    <h3>Telegram Direct (fallback)</h3>
    <div class="field">
      <label>Bot Token</label>
      <input type="password" id="inpToken" placeholder="123456:ABC-DEF..." value="${settings.botToken||''}">
      <div class="hint">सिर्फ तभी भरो अगर Server Feed सेट अप नहीं है। BotFather से मिला token यहां डालो, और bot को उस channel में admin बनाकर add करना ज़रूरी है।</div>
    </div>
    <div class="field">
      <label>Chat / Channel ID (optional)</label>
      <input type="text" id="inpChatId" placeholder="-1001234567890" value="${settings.chatId||''}">
      <div class="hint">खाली छोड़ सकते हो — पहला message आने पर auto-detect हो जाएगा।</div>
    </div>
    <div class="field">
      <label>Poll Interval (seconds)</label>
      <input type="number" id="inpInterval" min="5" value="${settings.pollInterval}">
    </div>
    <button class="btn btn-secondary" onclick="handleStart()">${settings.tracking && !settings.serverUrl ? '🔄 Restart Tracking' : '▶ Start Tracking (Telegram)'}</button>
  </div>

  <div class="card">
    <h3>Data</h3>
    <button class="btn btn-secondary" onclick="handleSync()">Sync Now</button>
    <button class="btn btn-danger" onclick="handleClear()">Clear All Trade Data</button>
  </div>
  `;
}

function render(){
  const main = $('#main');
  if(activeTab==='trades'){
    main.innerHTML = `<div class="section-label">Live &amp; Closed Trades</div>` + renderTrades() + renderTimeline();
  } else if(activeTab==='summary'){
    main.innerHTML = renderSummary();
  } else {
    main.innerHTML = renderSettings();
  }
  if(settings.tracking) setLive(true, 'Live — tracking active');
  else setLive(false, 'Not connected — open Settings to start');
}

/* =========================================================
   DETAIL MODAL
   ========================================================= */
window.openDetail = function(id){
  const t = trades[id] || Object.values(trades).find(x=>x.id===id);
  if(!t) return;
  const sm = statusMeta(t);
  const pl = plDisplay(t);
  const pillColor = sm.cls==='open' ? 'var(--blue)' : (sm.cls==='target' ? 'var(--green)' : 'var(--red)');
  $('#modalContent').innerHTML = `
    <div class="modal-handle"></div>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">
      <h3 style="font-family:'Rajdhani';font-size:18px;margin:0;">${t.symbol} ${t.strike||''}${t.optType||''}</h3>
      <span class="exit-pill" style="color:${pillColor};">${t.status==='OPEN'?'⏱ ':exitIcon(t.status)+' '}${sm.label}</span>
    </div>
    <div style="color:var(--text-faint);font-size:12px;margin-bottom:14px;">${t.strategy} ${t.strategyLabel?'— '+t.strategyLabel:''}</div>

    <div class="detail-row"><span class="k">Direction</span><span class="v">${t.direction||'--'}</span></div>
    <div class="detail-row"><span class="k">Entry Time</span><span class="v">${fmtTime(t.receivedAt)}</span></div>
    <div class="detail-row"><span class="k">Entry Premium</span><span class="v">₹${t.entry ?? '--'}</span></div>
    <div class="detail-row"><span class="k">Target Premium</span><span class="v">₹${t.target ?? '--'}</span></div>
    <div class="detail-row"><span class="k">SL Premium</span><span class="v">₹${t.sl ?? '--'}</span></div>
    <div class="detail-row"><span class="k">Trailing-SL (spot ref)</span><span class="v">${t.trailingSL ?? '--'}</span></div>
    <div class="detail-row"><span class="k">Spot Ref @ Entry</span><span class="v">${t.spotRef ?? '--'}</span></div>
    <div class="detail-row"><span class="k">Confidence</span><span class="v">${t.confidence ?? '--'}%</span></div>
    ${t.status!=='OPEN' ? `
    <div class="detail-row"><span class="k">Exit Time</span><span class="v">${fmtTime(t.exitTime)}</span></div>
    <div class="detail-row"><span class="k">Exit Premium</span><span class="v">₹${t.exitPremium ?? '--'}</span></div>
    <div class="detail-row"><span class="k">Exit Reason</span><span class="v" style="color:${pillColor};">${exitIcon(t.status)} ${sm.label}</span></div>
    <div class="detail-row"><span class="k">Trade चली</span><span class="v">⏱ ${fmtDuration(t.receivedAt, t.exitTime)}</span></div>
    ${t.exitSpot!=null ? `<div class="detail-row"><span class="k">Spot @ Exit</span><span class="v">${t.exitSpot}</span></div>` : ''}
    ${t.plSpotPts!=null ? `<div class="detail-row"><span class="k">Spot Move</span><span class="v" style="color:${t.plSpotPts>=0?'var(--green)':'var(--red)'}">${t.plSpotPts>=0?'+':''}${t.plSpotPts} pts</span></div>` : ''}
    <div class="detail-row"><span class="k">P/L (Premium)</span><span class="v" style="color:${pl.cls==='green'?'var(--green)':'var(--red)'}">${pl.text}</span></div>
    ` : `
    <div class="detail-row"><span class="k">अब तक चली</span><span class="v">⏱ ${fmtDuration(t.receivedAt)}</span></div>
    `}
    ${t.note ? `<div class="detail-row"><span class="k">Note</span><span class="v" style="text-align:right;font-family:'Inter';font-weight:400;">${t.note}</span></div>` : ''}
    <button class="btn btn-secondary" style="margin-top:16px;" onclick="closeDetail()">Close</button>
  `;
  $('#modalBackdrop').classList.add('show');
};
window.closeDetail = function(){ $('#modalBackdrop').classList.remove('show'); };
$('#modalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='modalBackdrop') closeDetail(); });

/* =========================================================
   SETTINGS HANDLERS
   ========================================================= */
window.handleStartServer = function(){
  settings.serverUrl = $('#inpServerUrl').value.trim();
  settings.pollInterval = parseInt($('#inpInterval2').value) || 15;
  if(!settings.serverUrl){ toast('Server Address डालना ज़रूरी है'); return; }
  startPolling();
  toast('Server Feed से Tracking शुरू हो गई ✓');
  render();
};
window.handleStart = function(){
  settings.botToken = $('#inpToken').value.trim();
  settings.chatId = $('#inpChatId').value.trim();
  settings.pollInterval = parseInt($('#inpInterval').value) || 15;
  settings.serverUrl = ''; // explicit Telegram mode overrides server feed
  if(!settings.botToken){ toast('Bot Token डालना ज़रूरी है'); return; }
  startPolling();
  toast('Telegram से Tracking शुरू हो गई ✓');
  render();
};
window.handleStop = function(){
  stopPolling();
  toast('Tracking रोक दी गई');
  render();
};
window.handleSync = function(){
  if(!settings.botToken){ toast('पहले Bot Token डालो'); return; }
  toast('Syncing...');
  pollOnce();
};
window.handleClear = async function(){
  if(!confirm('सारी trade history delete हो जाएगी। पक्का?')) return;
  for(const k of Object.keys(trades)){
    try{ await window.storage.delete(k); }catch(e){}
  }
  trades = {};
  toast('सारा data clear हो गया');
  render();
};

/* =========================================================
   PDF EXPORT
   ========================================================= */
window.exportJSONData = function(){
  const payload = {
    exportedAt: new Date().toISOString(),
    summary: computeSummary(),
    advanced: computeAdvancedAnalytics(),
    trades: tradeList()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'trishul_trade_data_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('JSON data export हो गया ✓');
};

window.exportPDF = function(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const s = computeSummary();
  let y = 18;
  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text('Trishul Pro — Trade Performance Report', 14, y); y+=6;
  doc.setFontSize(10); doc.setFont('helvetica','normal');
  doc.text('Generated: ' + new Date().toLocaleString('en-IN'), 14, y); y+=10;

  doc.setFont('helvetica','bold'); doc.setFontSize(12);
  doc.text('Summary', 14, y); y+=7;
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text(`Total Trades: ${s.total}   Open: ${s.open}   Closed: ${s.closed}`, 14, y); y+=6;
  doc.text(`Win Rate: ${s.winRate.toFixed(1)}%   Total P/L: ${s.totalPL>=0?'+':''}${s.totalPL}`, 14, y); y+=10;

  doc.setFont('helvetica','bold'); doc.setFontSize(12);
  doc.text('Strategy Performance', 14, y); y+=7;
  doc.setFontSize(9); doc.setFont('helvetica','bold');
  doc.text('Strategy', 14, y); doc.text('Trades', 80, y); doc.text('Win %', 110, y); doc.text('P/L', 140, y); y+=5;
  doc.setFont('helvetica','normal');
  s.stratRows.forEach(r=>{
    doc.text(String(r.name), 14, y);
    doc.text(String(r.trades), 80, y);
    doc.text(r.winRate.toFixed(0)+'%', 110, y);
    doc.text((r.pl>=0?'+':'')+r.pl, 140, y);
    y+=5.5;
    if(y>270){ doc.addPage(); y=18; }
  });

  y+=8;
  doc.setFont('helvetica','bold'); doc.setFontSize(12);
  doc.text('All Trades', 14, y); y+=7;
  doc.setFontSize(8); doc.setFont('helvetica','bold');
  doc.text('Symbol', 14, y); doc.text('Strategy', 45, y); doc.text('Entry', 80, y); doc.text('Exit', 100, y); doc.text('Status', 120, y); doc.text('P/L', 150, y); doc.text('Time', 170, y);
  y+=5;
  doc.setFont('helvetica','normal');
  tradeList().forEach(t=>{
    if(y>275){ doc.addPage(); y=18; }
    const pl = plDisplay(t);
    doc.text(`${t.symbol||''} ${t.strike||''}${t.optType||''}`, 14, y);
    doc.text(String(t.strategy||''), 45, y);
    doc.text(String(t.entry ?? '--'), 80, y);
    doc.text(String(t.exitPremium ?? '--'), 100, y);
    doc.text(String(t.status), 120, y);
    doc.text(pl.text, 150, y);
    doc.text(fmtTime(t.receivedAt), 170, y);
    y+=5.5;
  });

  doc.save('trishul_trade_report_'+new Date().toISOString().slice(0,10)+'.pdf');
  toast('PDF तैयार हो गई ✓');
};

/* =========================================================
   INIT
   ========================================================= */
$$('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    $$('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeTab = btn.dataset.tab;
    render();
  });
});

(async function init(){
  await loadState();
  render();
  if(settings.tracking && settings.botToken){
    startPolling();
  }
})();
</script>
</body>
</html>
