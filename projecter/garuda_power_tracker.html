<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Garuda Power — Systems Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #090b10;
    --bg-elev: #10131a;
    --bg-card: #141822;
    --line: #232a37;
    --gold: #d4a537;
    --gold-dim: #8a6f2a;
    --teal: #2dd4a0;
    --red: #e0574f;
    --blue: #4f9be0;
    --text: #e8eaee;
    --text-dim: #8b93a3;
    --text-faint: #4d5566;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  body{padding-bottom:50px;}
  h1,h2,.display{font-family:'Rajdhani',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* project switcher bar */
  .proj-bar{
    display:flex; align-items:center; gap:8px; padding:12px 16px; overflow-x:auto;
    background:var(--bg-elev); border-bottom:1px solid var(--line); scrollbar-width:none;
  }
  .proj-bar::-webkit-scrollbar{display:none;}
  .proj-chip{
    flex-shrink:0; font-size:12px; padding:7px 13px; border-radius:20px; white-space:nowrap;
    background:var(--bg-card); border:1px solid var(--line); color:var(--text-dim); cursor:pointer;
    font-weight:600;
  }
  .proj-chip.active{background:var(--gold); color:var(--bg); border-color:var(--gold);}
  .proj-add{
    flex-shrink:0; width:32px; height:32px; border-radius:50%; background:var(--bg-card);
    border:1.5px dashed var(--gold-dim); color:var(--gold-dim); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .proj-new-row{display:none; gap:8px; padding:0 16px 12px; background:var(--bg-elev); border-bottom:1px solid var(--line);}
  .proj-new-row.show{display:flex;}
  .proj-new-row input{
    flex:1; background:var(--bg-card); border:1px solid var(--line); border-radius:8px;
    color:var(--text); padding:9px 11px; font-size:12.5px;
  }
  .proj-new-row button{background:var(--gold); color:var(--bg); border:none; border-radius:8px; padding:0 14px; font-weight:600; font-size:13px;}

  header{
    padding:26px 16px 18px;
    background:radial-gradient(120% 100% at 50% 0%, #151a24 0%, var(--bg) 70%);
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px; letter-spacing:.2em; color:var(--gold-dim);
    text-transform:uppercase; margin-bottom:6px;
  }
  h1{font-size:28px; font-weight:700; letter-spacing:.02em; margin:0; color:var(--text);}
  h1 span{color:var(--gold);}
  .subtitle{color:var(--text-dim); font-size:12.5px; margin-top:3px;}

  .overview{display:flex; align-items:center; gap:18px; margin-top:20px;}
  .master-ring{
    position:relative; width:88px; height:88px; border-radius:50%; flex-shrink:0;
    background:conic-gradient(var(--gold) calc(var(--pct,0)*3.6deg), var(--line) 0deg);
    transition:background 0.5s ease;
  }
  .master-ring::before{content:''; position:absolute; inset:8px; border-radius:50%; background:var(--bg-elev);}
  .master-ring .val{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:1;}
  .master-ring .val b{font-family:'JetBrains Mono',monospace; font-size:19px; color:var(--gold);}
  .master-ring .val small{font-size:8px; color:var(--text-faint); letter-spacing:.08em; margin-top:1px;}

  .cat-bars{flex:1; display:flex; flex-direction:column; gap:8px;}
  .cat-bar-row{display:flex; align-items:center; gap:8px;}
  .cat-bar-label{font-size:10px; color:var(--text-dim); width:60px; flex-shrink:0; font-family:'JetBrains Mono',monospace; letter-spacing:.02em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cat-bar-track{flex:1; height:5px; background:var(--line); border-radius:3px; overflow:hidden;}
  .cat-bar-fill{height:100%; border-radius:3px; transition:width .5s ease;}
  .cat-bar-pct{font-size:10px; color:var(--text-faint); font-family:'JetBrains Mono',monospace; width:28px; text-align:right; flex-shrink:0;}

  .stats-strip{
    display:grid; grid-template-columns:repeat(3,1fr); gap:1px;
    background:var(--line); border:1px solid var(--line); border-radius:10px;
    overflow:hidden; margin-top:18px;
  }
  .stat-box{background:var(--bg-elev); padding:11px 8px; text-align:center;}
  .stat-box .num{font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:700; color:var(--gold);}
  .stat-box .lbl{font-size:9.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-top:2px;}

  main{padding:22px 16px 0;}
  .cat-section{margin-bottom:26px;}
  .cat-header{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .cat-dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
  .cat-title{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-dim); white-space:nowrap;}
  .cat-rule{flex:1; height:1px; background:var(--line);}

  .engine-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:12px;
    margin-bottom:10px; overflow:hidden; transition:border-color .2s ease;
  }
  .engine-card.expanded{border-color:var(--gold-dim);}
  .engine-head{display:flex; align-items:center; gap:12px; padding:12px 14px; cursor:pointer;}
  .ring-mini{
    position:relative; width:42px; height:42px; border-radius:50%; flex-shrink:0;
    background:conic-gradient(var(--ring-color,var(--gold)) calc(var(--pct,0)*3.6deg), var(--line) 0deg);
  }
  .ring-mini::before{content:''; position:absolute; inset:4px; border-radius:50%; background:var(--bg-card);}
  .ring-mini .ring-txt{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text); z-index:1; font-weight:600;
  }
  .engine-title-wrap{flex:1; min-width:0;}
  .engine-title{font-size:14px; font-weight:600; color:var(--text); line-height:1.25;}
  .engine-sub{font-size:11px; color:var(--text-dim); margin-top:2px; line-height:1.3;}
  .chevron{color:var(--text-faint); transition:transform .25s ease; flex-shrink:0; font-size:14px;}
  .engine-card.expanded .chevron{transform:rotate(90deg); color:var(--gold);}
  .engine-del{color:var(--text-faint); font-size:15px; flex-shrink:0; padding:2px 4px;}
  .engine-del:active{color:var(--red);}

  .engine-body{max-height:0; overflow:hidden; transition:max-height .3s ease;}
  .engine-card.expanded .engine-body{max-height:1100px;}
  .engine-body-inner{padding:0 14px 14px;}

  .expected-row{display:flex; align-items:center; gap:8px; margin-bottom:11px; font-size:11.5px; color:var(--text-dim);}
  .expected-row input{
    width:46px; background:var(--bg-elev); border:1px solid var(--line); border-radius:6px;
    color:var(--gold); font-family:'JetBrains Mono',monospace; text-align:center; padding:4px 2px; font-size:12.5px;
  }

  .file-list{display:flex; flex-direction:column; gap:6px; margin-bottom:10px;}
  .folder-hint{font-size:11px; color:var(--text-faint); margin-bottom:9px; word-break:break-all;}
  .folder-hint b{color:var(--text-dim); font-family:'JetBrains Mono',monospace; font-weight:600;}
  .folder-tag{
    flex-shrink:0; font-size:11px; padding:3px 6px; border-radius:6px; cursor:pointer;
    background:rgba(224,87,79,.12); color:var(--red);
  }
  .folder-tag.ok{background:rgba(45,212,160,.14); color:var(--teal);}
  .file-row{display:flex; align-items:center; gap:10px; background:var(--bg-elev); border:1px solid var(--line); border-radius:8px; padding:8px 10px;}
  .file-check{
    width:19px; height:19px; border-radius:5px; border:1.5px solid var(--text-faint);
    flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer;
    font-size:12px; color:transparent; transition:all .15s ease;
  }
  .file-check.checked{background:var(--teal); border-color:var(--teal); color:var(--bg);}
  .file-name{flex:1; font-size:12.5px; color:var(--text); word-break:break-word;}
  .file-row.checked .file-name{color:var(--text-dim); text-decoration:line-through; text-decoration-color:var(--text-faint);}
  .file-del{color:var(--text-faint); font-size:15px; cursor:pointer; padding:2px 5px; flex-shrink:0;}
  .file-del:active{color:var(--red);}
  .empty-note{font-size:11.5px; color:var(--text-faint); padding:6px 2px; font-style:italic;}

  .add-row{display:flex; gap:8px; margin-top:2px;}
  .add-row input{
    flex:1; background:var(--bg-elev); border:1px solid var(--line); border-radius:8px;
    color:var(--text); padding:9px 11px; font-size:12.5px; font-family:'Inter',sans-serif;
  }
  .add-row input:focus{outline:none; border-color:var(--gold-dim);}
  .add-btn{background:var(--gold); color:var(--bg); border:none; border-radius:8px; padding:0 14px; font-weight:600; font-size:13px; cursor:pointer; flex-shrink:0;}
  .add-btn:active{background:var(--gold-dim);}

  .upload-row{display:flex; gap:8px; margin-top:8px;}
  .upload-label{
    flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
    background:var(--bg-elev); border:1.5px dashed var(--teal); border-radius:8px;
    color:var(--teal); padding:10px 11px; font-size:12.5px; font-weight:600;
    cursor:pointer; font-family:'Inter',sans-serif;
  }
  .upload-label:active{background:rgba(45,212,160,.1);}
  /* visually-hidden pattern — more reliable than display:none for native file pickers on mobile */
  .upload-label input[type="file"]{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  .or-divider{display:flex; align-items:center; gap:8px; margin:9px 0 2px; color:var(--text-faint); font-size:10px; letter-spacing:.06em; text-transform:uppercase;}
  .or-divider::before,.or-divider::after{content:''; flex:1; height:1px; background:var(--line);}

  .add-module-row{display:flex; gap:8px; margin:4px 0 4px;}
  .add-module-row input{
    flex:1; background:var(--bg-card); border:1px dashed var(--line); border-radius:8px;
    color:var(--text); padding:9px 11px; font-size:12.5px;
  }
  .add-module-row button{background:var(--blue); color:var(--bg); border:none; border-radius:8px; padding:0 14px; font-weight:600; font-size:13px; flex-shrink:0;}

  .notes-area{
    width:100%; background:var(--bg-elev); border:1px solid var(--line); border-radius:8px;
    color:var(--text-dim); font-size:12px; padding:9px; margin-top:9px; resize:vertical;
    min-height:40px; font-family:'Inter',sans-serif;
  }
  .notes-area:focus{outline:none; border-color:var(--gold-dim); color:var(--text);}
  .notes-label{font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; margin-top:11px;}

  footer{text-align:center; padding:20px 16px 8px; color:var(--text-faint); font-size:10.5px; font-family:'JetBrains Mono',monospace; letter-spacing:.04em;}

  .toast{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--bg-elev); border:1px solid var(--gold-dim); color:var(--text);
    padding:9px 16px; border-radius:8px; font-size:12px; opacity:0; pointer-events:none;
    transition:all .3s ease; z-index:50; white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (min-width:640px){
    main{max-width:640px; margin:0 auto; padding:22px 20px 0;}
    header{padding:26px 20px 18px;}
    .proj-bar{max-width:640px; margin:0 auto;}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

<div class="proj-bar" id="projBar"></div>
<div class="proj-new-row" id="projNewRow">
  <input type="text" id="projNewInput" placeholder="नए प्रोजेक्ट का नाम लिखो" />
  <button id="projNewBtn">बनाओ</button>
</div>

<header>
  <div class="eyebrow" id="hdrEyebrow">GARUDA POWER // SYSTEMS OVERVIEW</div>
  <h1 id="hdrTitle">गरुड़ <span>पावर</span></h1>
  <div class="subtitle" id="hdrSubtitle">17-Engine Institutional-Grade Trading System — Build Status</div>

  <div class="overview">
    <div class="master-ring" id="masterRing" style="--pct:0">
      <div class="val"><b id="overallPct">0%</b><small>COMPLETE</small></div>
    </div>
    <div class="cat-bars" id="catBars"></div>
  </div>

  <div class="stats-strip">
    <div class="stat-box"><div class="num mono" id="statFiles">0/0</div><div class="lbl">Files Done</div></div>
    <div class="stat-box"><div class="num mono" id="statEngines">0/0</div><div class="lbl">Modules Live</div></div>
    <div class="stat-box"><div class="num mono" id="statRemaining">0</div><div class="lbl">Pending</div></div>
  </div>
</header>

<main id="mainContainer"></main>

<footer>GARUDA POWER — LOCAL PROGRESS LOG · DATA SAVED AUTOMATICALLY</footer>
<div class="toast" id="toast"></div>

<script>
/* ---------- builtin Garuda Power template ---------- */
const GARUDA_POWER_CATEGORIES = [
  {
    id:'core', title:'CORE TRADING PIPELINE', color:'#d4a537', builtin:true,
    engines:[
      { id:'data', title:'Data Engine', sub:'Historical + live data fetch, cache, validate', expected:5, builtin:true },
      { id:'formula', title:'Formula / Indicator Engine', sub:'RSI, MACD, VWAP सारे indicators', expected:3, builtin:true },
      { id:'strategy', title:'Strategy Engine', sub:'Multi-layer: Expiry, Scalping, Intraday, Smart-Money, Self-Learning', expected:8, builtin:true },
      { id:'risk', title:'Risk Engine', sub:'Position sizing, SL/target, drawdown control', expected:4, builtin:true },
      { id:'backtest', title:'Backtest Engine', sub:'Historical data पर strategy test', expected:4, builtin:true },
      { id:'execution', title:'Execution Engine', sub:'Order placement, broker से जुड़ना', expected:4, builtin:true },
    ]
  },
  {
    id:'intel', title:'INTELLIGENCE LAYER', color:'#4f9be0', builtin:true,
    engines:[
      { id:'smartmoney', title:'Smart Money / Order-Flow Engine', sub:'Order block, liquidity sweep, FVG, volume delta', expected:3, builtin:true },
      { id:'selflearn', title:'Self-Learning / Adaptive Engine', sub:'Rolling performance track, confidence-threshold auto-adjust', expected:3, builtin:true },
      { id:'portfolio', title:'Portfolio & Capital Allocation Engine', sub:'70/30 Index-Equity, 50/30/20 Expiry-Scalp-Intraday split', expected:2, builtin:true },
    ]
  },
  {
    id:'safety', title:'SAFETY & GOVERNANCE', color:'#e0574f', builtin:true,
    engines:[
      { id:'monitor', title:'Monitoring / Kill-Switch Engine', sub:'System health, auto-stop', expected:3, builtin:true },
      { id:'riskreport', title:'Risk Report Engine', sub:'Real-time exposure, drawdown dashboard', expected:3, builtin:true },
      { id:'security', title:'Security Engine', sub:'API key vault, encryption, access control', expected:3, builtin:true },
      { id:'compliance', title:'Compliance / Audit Engine', sub:'SEBI regulatory, trade audit trail', expected:2, builtin:true },
    ]
  },
  {
    id:'infra', title:'INFRASTRUCTURE & OPS', color:'#2dd4a0', builtin:true,
    engines:[
      { id:'logging', title:'Logging / Reporting Engine', sub:'Central logging, reports', expected:2, builtin:true },
      { id:'reconcile', title:'Reconciliation Engine', sub:'Broker records vs internal records मिलाना', expected:2, builtin:true },
      { id:'notify', title:'Notification / Alert Engine', sub:'SMS/Push/Email critical alerts', expected:2, builtin:true },
      { id:'failover', title:'Failover / Disaster-Recovery Engine', sub:'Broker heartbeat-based failover', expected:2, builtin:true },
    ]
  },
];
const CAT_SLUG = { core:'core-trading-pipeline', intel:'intelligence-layer', safety:'safety-governance', infra:'infrastructure-ops' };

const OLD_STORAGE_KEY = 'garuda-power-tracker-v2';   // old single-project save (for migration)
const PROJECTS_KEY = 'gpt-projects-list-v1';
const ACTIVE_PROJECT_KEY = 'gpt-active-project-v1';
const projectDataKey = id => `gpt-project-data:${id}`;

let projects = [];          // [{id, name, builtin}]
let activeProjectId = 'garuda-power';
let categories = [];        // categories for the active project
let state = {};             // per-engine file/notes state for active project
let expandedId = null;

function slugify(str){
  return (str||'').toString().trim().toLowerCase()
    .replace(/[^a-z0-9\u0900-\u097F]+/g,'-')
    .replace(/^-+|-+$/g,'') || 'project';
}
function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,8); }

function allEngineIds(){ return categories.flatMap(c => c.engines.map(e => e.id)); }

function defaultStateFor(cats){
  const s = {};
  cats.forEach(cat => cat.engines.forEach(e => { s[e.id] = { expected: e.expected||1, files: [], notes: '' }; }));
  return s;
}

function defaultCategoriesForNewProject(){
  return [ { id:'general', title:'मॉड्यूल्स / फाइलें', color:'#d4a537', builtin:false, engines:[] } ];
}

/* ---------- persistence ---------- */
async function loadProjectsList(){
  try{
    const res = await window.storage.get(PROJECTS_KEY, false);
    if(res && res.value){ projects = JSON.parse(res.value); }
    else { projects = [{id:'garuda-power', name:'गरुड़ पावर', builtin:true}]; await saveProjectsList(); }
  }catch(e){ projects = [{id:'garuda-power', name:'गरुड़ पावर', builtin:true}]; }
}
async function saveProjectsList(){
  try{ await window.storage.set(PROJECTS_KEY, JSON.stringify(projects), false); }catch(e){}
}

async function loadActiveProjectId(){
  try{
    const res = await window.storage.get(ACTIVE_PROJECT_KEY, false);
    if(res && res.value) activeProjectId = res.value;
  }catch(e){}
}
async function saveActiveProjectId(){
  try{ await window.storage.set(ACTIVE_PROJECT_KEY, activeProjectId, false); }catch(e){}
}

async function loadProjectData(id){
  try{
    const res = await window.storage.get(projectDataKey(id), false);
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){}

  // first time garuda-power loads: migrate old single-project save if present
  if(id === 'garuda-power'){
    try{
      const old = await window.storage.get(OLD_STORAGE_KEY, false);
      if(old && old.value){
        const oldState = JSON.parse(old.value);
        const cats = JSON.parse(JSON.stringify(GARUDA_POWER_CATEGORIES));
        const st = defaultStateFor(cats);
        Object.keys(oldState).forEach(k=>{ if(st[k]) st[k] = oldState[k]; });
        return { categories: cats, state: st };
      }
    }catch(e){}
    const cats = JSON.parse(JSON.stringify(GARUDA_POWER_CATEGORIES));
    return { categories: cats, state: defaultStateFor(cats) };
  }

  const cats = defaultCategoriesForNewProject();
  return { categories: cats, state: defaultStateFor(cats) };
}

async function saveProjectData(){
  try{ await window.storage.set(projectDataKey(activeProjectId), JSON.stringify({categories, state}), false); }
  catch(e){ showToast('Save error — दोबारा कोशिश करो'); }
}

async function switchProject(id){
  activeProjectId = id;
  await saveActiveProjectId();
  const data = await loadProjectData(id);
  categories = data.categories;
  state = data.state;
  allEngineIds().forEach(eid => { if(!state[eid]) state[eid] = {expected:1, files:[], notes:''}; });
  expandedId = null;
  render();
}

async function addProject(name){
  name = (name||'').trim();
  if(!name) return;
  const id = uid('proj');
  projects.push({id, name, builtin:false});
  await saveProjectsList();
  await switchProject(id);
  renderProjectBar();
  showToast('नया प्रोजेक्ट बन गया');
}

/* ---------- engine/module management ---------- */
function addEngineToCategory(catId, name){
  name = (name||'').trim();
  if(!name) return;
  const cat = categories.find(c=>c.id===catId);
  if(!cat) return;
  const id = uid('mod');
  cat.engines.push({ id, title:name, sub:'', expected:1, builtin:false });
  state[id] = { expected:1, files:[], notes:'' };
  saveProjectData(); expandedId = id; render();
  showToast('मॉड्यूल जुड़ गया — अब फाइलें अपलोड करो');
}

function deleteEngine(catId, engineId){
  const cat = categories.find(c=>c.id===catId);
  if(!cat) return;
  cat.engines = cat.engines.filter(e=>e.id!==engineId);
  delete state[engineId];
  if(expandedId===engineId) expandedId = null;
  saveProjectData(); render();
}

/* ---------- calc helpers ---------- */
function enginePct(id){
  const d = state[id];
  const target = Math.max(d.expected, d.files.length || 1);
  const done = d.files.filter(f=>f.done).length;
  return Math.round((done/target)*100);
}
function engineStatus(id){
  const d = state[id];
  if(!d.files.length) return 'empty';
  const done = d.files.filter(f=>f.done).length;
  if(done===0) return 'empty';
  if(done >= d.files.length && done >= d.expected) return 'done';
  return 'progress';
}
function categoryPct(cat){
  const ids = cat.engines.map(e=>e.id);
  if(!ids.length) return 0;
  return Math.round(ids.reduce((a,id)=>a+enginePct(id),0)/ids.length);
}

/* ---------- render ---------- */
function render(){ renderProjectBar(); renderHeader(); renderOverview(); renderMain(); }

function renderProjectBar(){
  const bar = document.getElementById('projBar');
  bar.innerHTML = projects.map(p=>`<div class="proj-chip ${p.id===activeProjectId?'active':''}" data-pid="${p.id}">${escapeHtml(p.name)}</div>`).join('')
    + `<div class="proj-add" id="projAddBtn">+</div>`;
  bar.querySelectorAll('.proj-chip').forEach(chip=>{
    chip.addEventListener('click', ()=> switchProject(chip.getAttribute('data-pid')));
  });
  document.getElementById('projAddBtn').addEventListener('click', ()=>{
    document.getElementById('projNewRow').classList.toggle('show');
  });
}

function renderHeader(){
  const proj = projects.find(p=>p.id===activeProjectId);
  const isBuiltin = proj && proj.builtin;
  document.getElementById('hdrEyebrow').textContent = isBuiltin ? 'GARUDA POWER // SYSTEMS OVERVIEW' : (proj ? proj.name.toUpperCase()+' // PROJECT TRACKER' : 'PROJECT TRACKER');
  document.getElementById('hdrTitle').innerHTML = isBuiltin ? 'गरुड़ <span>पावर</span>' : escapeHtml(proj ? proj.name : 'प्रोजेक्ट');
  document.getElementById('hdrSubtitle').textContent = isBuiltin ? '17-Engine Institutional-Grade Trading System — Build Status' : 'Modules / Files — Build Status';
}

function renderOverview(){
  const allIds = allEngineIds();
  let totalDone=0, totalFiles=0, enginesLive=0, pending=0;
  allIds.forEach(id=>{
    const d = state[id];
    const done = d.files.filter(f=>f.done).length;
    totalDone += done; totalFiles += d.files.length; pending += (d.files.length-done);
    if(engineStatus(id)==='done') enginesLive++;
  });
  const overallPct = allIds.length ? Math.round(allIds.reduce((a,id)=>a+enginePct(id),0)/allIds.length) : 0;

  document.getElementById('masterRing').style.setProperty('--pct', overallPct);
  document.getElementById('overallPct').textContent = overallPct+'%';
  document.getElementById('statFiles').textContent = totalDone+'/'+totalFiles;
  document.getElementById('statEngines').textContent = enginesLive+'/'+allIds.length;
  document.getElementById('statRemaining').textContent = pending;

  const catBars = document.getElementById('catBars');
  catBars.innerHTML = categories.map(cat=>{
    const pct = categoryPct(cat);
    return `<div class="cat-bar-row">
      <div class="cat-bar-label" style="color:${cat.color}">${escapeHtml(cat.title.split(' ')[0])}</div>
      <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${pct}%; background:${cat.color}"></div></div>
      <div class="cat-bar-pct">${pct}%</div>
    </div>`;
  }).join('');
}

function renderMain(){
  const container = document.getElementById('mainContainer');
  container.innerHTML = '';
  categories.forEach(cat=>{
    const section = document.createElement('div');
    section.className = 'cat-section';
    section.innerHTML = `
      <div class="cat-header">
        <div class="cat-dot" style="background:${cat.color}"></div>
        <div class="cat-title" style="color:${cat.color}">${escapeHtml(cat.title)}</div>
        <div class="cat-rule"></div>
      </div>
      <div class="cat-engines" data-cat="${cat.id}"></div>
      <div class="add-module-row">
        <input type="text" placeholder="नया मॉड्यूल / इंजन का नाम" data-role="newmodule" />
        <button data-role="addmodulebtn">+ जोड़ो</button>
      </div>
    `;
    container.appendChild(section);
    const list = section.querySelector('.cat-engines');
    cat.engines.forEach(e => list.appendChild(buildEngineCard(e, cat)));

    const modInput = section.querySelector('[data-role="newmodule"]');
    const modBtn = section.querySelector('[data-role="addmodulebtn"]');
    const doAddModule = ()=>{ addEngineToCategory(cat.id, modInput.value); };
    modBtn.addEventListener('click', doAddModule);
    modInput.addEventListener('keydown', ev=>{ if(ev.key==='Enter') doAddModule(); });
  });
}

function projectSlug(){
  const proj = projects.find(p=>p.id===activeProjectId);
  if(proj && proj.builtin) return 'garuda-power';
  return slugify(proj ? proj.name : 'project');
}

function buildEngineCard(e, cat){
  const color = cat.color;
  const catSlug = cat.builtin ? (CAT_SLUG[cat.id]||cat.id) : slugify(cat.title);
  const folderPath = `${projectSlug()}/${catSlug}/${slugify(e.title)||e.id}/`;
  const d = state[e.id];
  const status = engineStatus(e.id);
  const pct = enginePct(e.id);
  const doneCount = d.files.filter(f=>f.done).length;
  const isExpanded = expandedId === e.id;

  const card = document.createElement('div');
  card.className = 'engine-card' + (isExpanded ? ' expanded' : '');
  card.setAttribute('data-id', e.id);

  card.innerHTML = `
    <div class="engine-head">
      <div class="ring-mini" style="--pct:${pct}; --ring-color:${status==='done'?'#2dd4a0':color}">
        <div class="ring-txt">${pct}</div>
      </div>
      <div class="engine-title-wrap">
        <div class="engine-title">${escapeHtml(e.title)}</div>
        <div class="engine-sub">${escapeHtml(e.sub||'')}</div>
      </div>
      ${e.builtin ? '' : '<div class="engine-del" data-role="engdel">✕</div>'}
      <div class="chevron">▸</div>
    </div>
    <div class="engine-body">
      <div class="engine-body-inner">
        <div class="expected-row">
          <span>अंदाज़न कुल फाइलें:</span>
          <input type="number" min="1" max="50" value="${d.expected}" data-role="expected" />
          <span class="mono" style="margin-left:auto; color:${color}">${doneCount}/${Math.max(d.expected,d.files.length)} done</span>
        </div>

        <div class="folder-hint">📁 सही folder: <b>${folderPath}</b></div>

        <div class="file-list" data-role="filelist">
          ${d.files.length ? d.files.map((f,fi)=>`
            <div class="file-row ${f.done?'checked':''}" data-fi="${fi}">
              <div class="file-check ${f.done?'checked':''}" data-role="check">${f.done?'✓':''}</div>
              <div class="file-name">${escapeHtml(f.name)}</div>
              <div class="folder-tag ${f.folderOk?'ok':''}" data-role="foldertag">${f.folderOk?'📁✓':'📁?'}</div>
              <div class="file-del" data-role="del">✕</div>
            </div>
          `).join('') : `<div class="empty-note">अभी कोई फाइल add नहीं हुई — नीचे से अपलोड करो</div>`}
        </div>

        <div class="upload-row">
          <label class="upload-label">
            📤 फाइल अपलोड करो (फोन से चुनो)
            <input type="file" multiple data-role="uploadinput" />
          </label>
        </div>

        <div class="or-divider">या नाम से जोड़ो</div>

        <div class="add-row">
          <input type="text" placeholder="फाइल का नाम" data-role="newfile" />
          <button class="add-btn" data-role="addbtn">जोड़ो</button>
        </div>

        <div class="notes-label">नोट्स</div>
        <textarea class="notes-area" placeholder="इस मॉड्यूल के बारे में decide क्या हुआ..." data-role="notes">${escapeHtml(d.notes||'')}</textarea>
      </div>
    </div>
  `;

  card.querySelector('.engine-head').addEventListener('click', (ev)=>{
    if(ev.target.closest('[data-role="engdel"]')) return;
    toggleExpand(e.id);
  });

  const delBtn = card.querySelector('[data-role="engdel"]');
  if(delBtn){
    delBtn.addEventListener('click', ev=>{
      ev.stopPropagation();
      deleteEngine(cat.id, e.id);
    });
  }

  const expInput = card.querySelector('[data-role="expected"]');
  expInput.addEventListener('click', ev=>ev.stopPropagation());
  expInput.addEventListener('change', ev=>{
    let v = parseInt(ev.target.value)||1; if(v<1) v=1;
    d.expected = v; saveProjectData(); render();
  });

  card.querySelectorAll('[data-role="check"]').forEach(chk=>{
    chk.addEventListener('click', ev=>{
      ev.stopPropagation();
      const fi = parseInt(chk.closest('.file-row').getAttribute('data-fi'));
      d.files[fi].done = !d.files[fi].done;
      saveProjectData(); render();
    });
  });
  card.querySelectorAll('[data-role="del"]').forEach(del=>{
    del.addEventListener('click', ev=>{
      ev.stopPropagation();
      const fi = parseInt(del.closest('.file-row').getAttribute('data-fi'));
      d.files.splice(fi,1); saveProjectData(); render();
    });
  });
  card.querySelectorAll('[data-role="foldertag"]').forEach(tag=>{
    tag.addEventListener('click', ev=>{
      ev.stopPropagation();
      const fi = parseInt(tag.closest('.file-row').getAttribute('data-fi'));
      d.files[fi].folderOk = !d.files[fi].folderOk;
      saveProjectData(); render();
      showToast(d.files[fi] && d.files[fi].folderOk ? 'folder confirm हो गया ✓' : `याद रखो: ${folderPath}`);
    });
  });

  const uploadLabel = card.querySelector('.upload-label');
  uploadLabel.addEventListener('click', ev=>ev.stopPropagation());
  const uploadInput = card.querySelector('[data-role="uploadinput"]');
  uploadInput.addEventListener('click', ev=>ev.stopPropagation());
  uploadInput.addEventListener('change', async ev=>{
    const chosen = Array.from(ev.target.files || []);
    if(!chosen.length) return;

    function addFile(name){
      const already = d.files.find(x=>x.name===name);
      if(already){ already.done = true; }
      else { d.files.push({name, done:true, folderOk:false}); }
    }

    let zipEntryCount = 0, plainCount = 0;
    for(const f of chosen){
      if(f.name.toLowerCase().endsWith('.zip') && window.JSZip){
        try{
          const zip = await JSZip.loadAsync(f);
          const names = Object.keys(zip.files).filter(n => !zip.files[n].dir);
          names.forEach(n => { addFile(n); zipEntryCount++; });
        }catch(err){
          addFile(f.name); plainCount++;
          showToast('zip खोलने में दिक्कत — फाइल normal add कर दी');
        }
      } else {
        addFile(f.name); plainCount++;
      }
    }

    saveProjectData(); expandedId = e.id; render();
    if(zipEntryCount && plainCount) showToast(`zip से ${zipEntryCount} फाइलें + ${plainCount} अलग फाइल ✓`);
    else if(zipEntryCount) showToast(`zip खुल गई — अंदर की ${zipEntryCount} फाइलें add हो गईं ✓`);
    else showToast(plainCount>1 ? plainCount+' फाइलें अपलोड हो गईं ✓' : 'फाइल अपलोड हो गई ✓');
  });

  const newFileInput = card.querySelector('[data-role="newfile"]');
  const addBtn = card.querySelector('[data-role="addbtn"]');
  newFileInput.addEventListener('click', ev=>ev.stopPropagation());
  const doAdd = ()=>{
    const name = newFileInput.value.trim();
    if(!name) return;
    d.files.push({name, done:false, folderOk:false});
    saveProjectData(); expandedId = e.id; render();
    showToast('फाइल जोड़ी गई');
  };
  addBtn.addEventListener('click', ev=>{ev.stopPropagation(); doAdd();});
  newFileInput.addEventListener('keydown', ev=>{ if(ev.key==='Enter'){ ev.stopPropagation(); doAdd(); } });

  const notesArea = card.querySelector('[data-role="notes"]');
  notesArea.addEventListener('click', ev=>ev.stopPropagation());
  let notesTimer;
  notesArea.addEventListener('input', ev=>{
    d.notes = ev.target.value;
    clearTimeout(notesTimer);
    notesTimer = setTimeout(saveProjectData, 500);
  });

  return card;
}

function toggleExpand(id){
  expandedId = (expandedId === id) ? null : id;
  render();
  if(expandedId){
    setTimeout(()=>{
      const el = document.querySelector(`.engine-card[data-id="${expandedId}"]`);
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    }, 80);
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=> t.classList.remove('show'), 1700);
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ---------- boot ---------- */
async function boot(){
  await loadProjectsList();
  await loadActiveProjectId();
  if(!projects.find(p=>p.id===activeProjectId)) activeProjectId = projects[0].id;
  const data = await loadProjectData(activeProjectId);
  categories = data.categories;
  state = data.state;
  render();

  document.getElementById('projNewBtn').addEventListener('click', ()=>{
    const input = document.getElementById('projNewInput');
    addProject(input.value);
    input.value='';
    document.getElementById('projNewRow').classList.remove('show');
  });
  document.getElementById('projNewInput').addEventListener('keydown', ev=>{
    if(ev.key==='Enter'){
      addProject(ev.target.value);
      ev.target.value='';
      document.getElementById('projNewRow').classList.remove('show');
    }
  });
}
boot();
</script>
</body>
</html>
